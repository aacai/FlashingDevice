[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-device"
version = "0.1.0"
description = "Open-source Qualcomm 9008 / EDL flashing tool with safety guards, backups and real progress"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "FlashingDevice contributors" }]
keywords = ["qualcomm", "edl", "9008", "firehose", "flashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: System :: Hardware",
]
dependencies = [
  "PyQt6>=6.5",
  "pyusb>=1.3.1",
  "pyserial>=3.5",
  "lxml>=5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
edl = [
  # EDL core is integrated as git submodule (third_party/edl),
  # not via pip, to keep versions auditable. This extra is for direct deps.
  "pycryptodome>=3.20",
  "docopt>=0.6.2",
  "colorama>=0.4.6",
  "capstone",
  "keystone-engine",
  "requests>=2.31",
  "passlib",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "pyinstaller>=6",
]
test = [
  "pytest>=8",
]

[project.scripts]
flash-device = "flash_device.app:main"

[project.gui-scripts]
flash-device-gui = "flash_device.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# USB hot-poll must never crash the GUI -> broad except is intentional.
# E501 handled by formatter; EXE001 irrelevant for `python -m` entry.
ignore = ["BLE001", "S110", "S112", "EXE001", "UP009", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
