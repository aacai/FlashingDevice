name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux
          - os: macos-14
            asset: macos
          - os: windows-2022
            asset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          pip install -e .
          python -m pytest -q
          python -m flash_device --self-test
          pyinstaller packaging/pyinstaller.spec
      - name: Smoke test frozen bundle
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN=./dist/flash-device/flash-device
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --check-env || true
          "$BIN" --self-test
      - name: Pack
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.asset }}" = "windows" ]; then
            7z a ../flash-device-${{ matrix.asset }}-${{ github.ref_name }}.zip flash-device
          else
            tar -czf ../flash-device-${{ matrix.asset }}-${{ github.ref_name }}.tar.gz flash-device
          fi
          cd ..
          ls -lh flash-device-*
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: flash-device-*.zip,flash-device-*.tar.gz
          generate_release_notes: true
