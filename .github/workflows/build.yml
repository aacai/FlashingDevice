name: build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (no device needed)
        run: |
          python -m pytest -q
          python -c "from flash_device.backend.progress import parse_line, ProgressState; s=ProgressState(); parse_line('Progress: |x| 10.0% Write foo', s); print(s)"
      - name: PyInstaller (onedir)
        run: |
          pip install -e .
          pyinstaller --noconfirm --onedir --name flash-device --paths src src/flash_device/__main__.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-device-${{ matrix.artifact }}
          path: dist/
          retention-days: 7
