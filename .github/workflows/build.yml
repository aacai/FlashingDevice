name: build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          pip install -e .
      - name: Smoke test (no device needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q
          python -m flash_device --check-env || true
          python -m flash_device --self-test
      - name: PyInstaller (spec, onedir)
        run: |
          pyinstaller packaging/pyinstaller.spec
      - name: Smoke test frozen bundle
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN=./dist/flash-device/flash-device
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --check-env || true
          "$BIN" --self-test
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-device-${{ matrix.artifact }}
          path: dist/
          retention-days: 7
