name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps (no brew)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          if [ -f third_party/edl/requirements.txt ]; then pip install -r third_party/edl/requirements.txt; fi
      - name: Forbid brew usage
        # Only match real invocations (line-start or after shell chaining / `run:`),
        # not policy prose like "no `brew install` ..." in docs.
        run: |
          if grep -rinE '(^|[;|&]|run:)[[:space:]]*brew install' --exclude-dir=.git --exclude-dir=third_party --exclude=.github/workflows/ci.yml . ; then
            echo "'brew install' via Homebrew is forbidden here; use official installers instead."; exit 1; fi
      - name: Forbid symlinks
        run: |
          if find . -path ./.git -prune -o -path ./third_party -prune -o -type l -print | grep . ; then
            echo "symlinks forbidden"; exit 1; fi
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
